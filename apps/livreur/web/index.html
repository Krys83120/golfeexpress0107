<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no,viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B35" />
    <!-- iOS Safari (Ajouter à l'écran d'accueil) ignore les icônes du
         manifest.json et affiche le favicon par défaut si aucune balise
         apple-touch-icon n'est présente -- d'où l'icône "Do You Geckoo"
         générique (favicon.png, partagé avec l'app Client) qui s'affichait
         à la place de la mascotte livreur. Ajouté le 27/09/2026, même
         correctif que apps/pro/index.html (voir son commentaire). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Application fonctionnelle réservée aux livreurs connectés, pas de
         contenu éditorial -- ne doit pas être indexée. Voir aussi
         public/robots.txt (LOT 1, audit SEO/GEO du 24/08/2026). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Do You Geckoo Livreur</title>
    <meta name="description" content="Livrez sur le Golfe de Saint-Tropez, à votre rythme, mieux payé." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Do You Geckoo Livreur" />
    <meta property="og:description" content="Livrez sur le Golfe de Saint-Tropez, à votre rythme, mieux payé." />
    <meta property="og:image" content="https://hqofwdrgtxvpnfwhaefn.supabase.co/storage/v1/object/public/branding-assets/og-livreur.png" />
    <meta property="og:url" content="https://livreur.doyougeckoo.fr" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
